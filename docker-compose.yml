services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - store-network

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    env_file: .env
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - store-network

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    env_file: .env
    expose:
      - "3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - store-network

  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile
    env_file: .env
    expose:
      - "3003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - store-network

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    env_file: .env
    expose:
      - "3004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - store-network

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    env_file: .env
    expose:
      - "3005"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - store-network

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
    restart: unless-stopped
    networks:
      - store-network

networks:
  store-network:
    driver: bridge

volumes:
  pgdata: